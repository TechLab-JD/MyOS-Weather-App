<div class="app-window" id="WeatherApp">
  <div class="app-header">
    <span class="app-title">🌤️ Weather</span>
    <div class="app-controls"><button class="minimize-btn">–</button><button class="close-btn">×</button></div>
  </div>
  <div class="app-content">
    <div class="wx">
      <form id="wx-form" class="wx-form">
        <input id="wx-city" type="text" placeholder="Enter a city…" autocomplete="off">
        <button type="submit">Go</button>
      </form>
      <div id="wx-result" class="wx-result"></div>
    </div>
  </div>
  <div class="resize-handle"></div>
</div>
